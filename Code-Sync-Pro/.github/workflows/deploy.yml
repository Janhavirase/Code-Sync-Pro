name: Code-Sync-Pro CI/CD

on:
  push:
    branches: [ "main" ] # Triggers when you push to main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # 1. Log into Docker Hub using your secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 2. Build and Push the Backend Image
      - name: Build and Push Backend
        uses: docker/build-push-action@v4
        with:
          context: ./server
          push: true
          # This tags the image as 'latest' in your Docker Hub account
          tags: ${{ secrets.DOCKER_USERNAME }}/codesync-backend:latest

      # 3. Trigger Render to pull the new image (We will add this secret in Step 4)
      - name: Trigger Render Deployment
        if: github.ref == 'refs/heads/main'
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}